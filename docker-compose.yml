services:
  postgres:
    image: postgres:16-alpine
    container_name: walletflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: walletflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - walletflow-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: walletflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - walletflow-redis-data:/data

volumes:
  walletflow-postgres-data:
  walletflow-redis-data: